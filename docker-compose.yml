version: "3.7"

services:
  db:
    image: bitnami/postgresql:latest
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=appointments_db
    container_name: appointments_app_db
    volumes:
      - appointments_pg_data:/bitnami/postgresql

volumes:
  appointments_pg_data:
